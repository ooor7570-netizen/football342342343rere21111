<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальная Синхронизация Экранов</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #000;
        }
        #content-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
        
        /* Окно настройки при входе */
        #setup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,15,15,0.95); color: #fff; display: flex;
            flex-direction: column; align-items: center; justify-content: center; z-index: 5000;
        }
        .container {
            background: #222; padding: 25px; border-radius: 8px; max-width: 450px; width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #444;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #ccc; }
        input[type="number"], input[type="text"] { 
            width: 100%; padding: 10px; box-sizing: border-box; background: #111; 
            color: #fff; border: 1px solid #444; border-radius: 4px; transition: border 0.2s;
        }
        input:focus { border-color: #007bff; outline: none; }
        
        /* Кнопки */
        button { 
            background: #007bff; color: white; border: none; padding: 10px 15px; 
            border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        button:hover { background: #0056b3; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        
        .hint { color: #888; font-size: 12px; margin-top: 5px; line-height: 1.4; }

        /* Плашка номера */
        #screen-number-display {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.95); color: white; padding: 25px 50px;
            font-size: 6rem; font-weight: bold; border-radius: 12px; z-index: 9999;
            display: none; text-shadow: 2px 2px 5px #000; box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        /* ПАНЕЛЬ МАСТЕРА */
        #master-panel {
            position: fixed; top: 10px; right: 10px; bottom: 10px; width: 450px;
            background: rgba(24, 24, 28, 0.95); border: 1px solid #ffcc00; border-radius: 8px;
            z-index: 4000; display: none; color: #fff; flex-direction: column;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
        }
        .panel-header { padding: 15px; border-bottom: 1px solid #333; background: #1e1e22; border-radius: 7px 7px 0 0; }
        .panel-header h3 { margin: 0; color: #ffcc00; font-size: 18px; }
        .panel-body { padding: 15px; flex: 1; overflow-y: auto; }
        
        .section-title { font-size: 13px; text-transform: uppercase; color: #888; letter-spacing: 1px; margin: 20px 0 10px 0; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        /* Карточка экрана в списке */
        .screen-card {
            background: #2d2d35; border: 1px solid #444; border-radius: 6px; padding: 12px; margin-bottom: 12px;
        }
        .screen-card h4 { margin: 0 0 10px 0; color: #ffcc00; font-size: 15px; display: flex; justify-content: space-between; }
        .screen-card .res-tag { font-size: 11px; color: #aaa; font-weight: normal; }
        .control-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; gap: 5px; }
        .control-row button { padding: 5px 10px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="screen-number-display">1,1</div>

    <div id="content-wrapper">
        <iframe id="content-frame" src="about:blank"></iframe>
    </div>

    <!-- Первичный вход -->
    <div id="setup-overlay">
        <div class="container">
            <h2>Настройка Экрана</h2>
            <p class="hint">Укажите номер экрана. Нажмите английскую клавишу <strong>"E"</strong> для активации панели управления Мастера.</p>
            <hr style="border-color:#333;">
            <div class="form-group">
                <label>Порядковый номер экрана:</label>
                <input type="number" id="screen-idx" value="1" min="1">
            </div>
            <button onclick="saveScreenConfig()">Подключить монитор</button>
        </div>
    </div>

    <!-- Меню Мастера -->
    <div id="master-panel">
        <div class="panel-header">
            <h3>Панель Управления Мастера 👑</h3>
        </div>
        <div class="panel-body">
            
            <div class="section-title">Глобальная заглушка</div>
            <div class="form-group">
                <label>URL Заглушки для всех:</label>
                <input type="text" id="master-stub-url" placeholder="https://example.com" value="about:blank">
            </div>
            <div class="grid-2">
                <button onclick="globalStubToggle(true)" class="btn-danger">🔴 ВКЛЮЧИТЬ ДЛЯ ВСЕХ</button>
                <button onclick="globalStubToggle(false)" class="btn-success">🟢 ВЫКЛЮЧИТЬ ДЛЯ ВСЕХ</button>
            </div>
            
            <div class="section-title">Сервисные команды</div>
            <button onclick="triggerIdentify()" class="btn-secondary" style="width:100%;">Вывести номера на экраны</button>

            <div class="section-title">Настройка потоков каждого экрана</div>
            <div id="master-screens-list">
                <!-- Карточки экранов генерируются через JS -->
            </div>
            
        </div>
    </div>
    <script>
        const channel = new BroadcastChannel('local_sync_screens');
        
        let myIdx = 1;
        let mySubIdx = 1;
        let isMaster = false;
        
        const getDisplayWidth = () => window.innerWidth;
        const getDisplayHeight = () => window.innerHeight;
        const getResolutionStr = () => `${getDisplayWidth()}x${getDisplayHeight()}`;

        // Инициализация окна
        function saveScreenConfig() {
            myIdx = parseInt(document.getElementById('screen-idx').value) || 1;
            document.getElementById('setup-overlay').style.display = 'none';
            announceScreen();
        }

        function announceScreen() {
            channel.postMessage({
                type: 'REGISTER_SCREEN',
                idx: myIdx,
                resStr: getResolutionStr()
            });
        }

        // Включение режима Мастера по кнопке "E"
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'e' || e.key.toLowerCase() === 'у') {
                if (document.activeElement.tagName === 'INPUT') return;
                
                isMaster = true;
                document.getElementById('setup-overlay').style.display = 'none';
                document.getElementById('master-panel').style.display = 'flex';
                
                requestReindex();
            }
        });

        function requestReindex() {
            if (!isMaster) return;
            window.discoveredScreens = [];
            channel.postMessage({ type: 'REQUEST_ANNOUNCE' });
            setTimeout(renderMasterControls, 300);
        }

        window.discoveredScreens = [];

        // Построение списка управления экранами
        function renderMasterControls() {
            const listDiv = document.getElementById('master-screens-list');
            listDiv.innerHTML = '';
            
            if (window.discoveredScreens.length === 0) {
                listDiv.innerHTML = '<p class="hint">Подключенные экраны не найдены...</p>';
                return;
            }

            // Сортируем по порядковому номеру и подномерам одинаковых разрешений
            window.discoveredScreens.sort((a,b) => a.idx - b.idx || a.subIdx - b.subIdx);

            window.discoveredScreens.forEach((scr) => {
                const labelText = `Экран ${scr.idx}${scr.isDuplicate ? ',' + scr.subIdx : ''}`;
                
                const html = `
                    <div class="screen-card" id="card-${scr.idKey}">
                        <h4>
                            <span>🖥️ ${labelText}</span>
                            <span class="res-tag">${scr.resStr}</span>
                        </h4>
                        
                        <div class="form-group">
                            <label>Основной URL (Поток 1):</label>
                            <input type="text" id="url1-${scr.idKey}" placeholder="https://..." onchange="sendConfigToScreen('${scr.idKey}')">
                        </div>
                        
                        <div class="form-group">
                            <label>Резервный URL (Поток 2):</label>
                            <input type="text" id="url2-${scr.idKey}" placeholder="https://..." onchange="sendConfigToScreen('${scr.idKey}')">
                        </div>

                        <div class="control-row">
                            <label style="font-weight:normal; display:inline-flex; align-items:center; gap:4px;">
                                <input type="checkbox" id="except-${scr.idKey}" onchange="sendConfigToScreen('${scr.idKey}')"> Исключить из общего откл.
                            </label>
                            <div style="display:flex; gap:4px;">
                                <button onclick="setIndividualStub('${scr.idKey}', true)" class="btn-danger">Вкл. заглушку</button>
                                <button onclick="setIndividualStub('${scr.idKey}', false)" class="btn-success">Выкл.</button>
                            </div>
                        </div>
                    </div>
                `;
                listDiv.insertAdjacentHTML('beforeend', html);
            });
        }

        // Отправка персональных URL и флагов конкретному экрану
        function sendConfigToScreen(idKey) {
            const scr = window.discoveredScreens.find(s => s.idKey === idKey);
            if (!scr) return;

            const url1 = document.getElementById(`url1-${idKey}`).value;
            const url2 = document.getElementById(`url2-${idKey}`).value;
            const isException = document.getElementById(`except-${idKey}`).checked;

            channel.postMessage({
                type: 'SET_SCREEN_URLS',
                idx: scr.idx,
                subIdx: scr.subIdx,
                url1: url1,
                url2: url2,
                isException: isException
            });
        }
        // Глобальное переключение заглушек со стороны Мастера
        function globalStubToggle(enable) {
            const stubUrl = document.getElementById('master-stub-url').value || 'about:blank';
            
            window.discoveredScreens.forEach(scr => {
                const isException = document.getElementById(`except-${scr.idKey}`).checked;

                channel.postMessage({
                    type: 'SET_STUB_MODE',
                    idx: scr.idx,
                    subIdx: scr.subIdx,
                    enable: enable,
                    stubUrl: stubUrl,
                    isGlobal: true,
                    isException: isException
                });
            });
        }

        // Индивидуальное переключение заглушки для одного экрана
        function setIndividualStub(idKey, enable) {
            const scr = window.discoveredScreens.find(s => s.idKey === idKey);
            if (!scr) return;

            const stubUrl = document.getElementById('master-stub-url').value || 'about:blank';

            channel.postMessage({
                type: 'SET_STUB_MODE',
                idx: scr.idx,
                subIdx: scr.subIdx,
                enable: enable,
                stubUrl: stubUrl,
                isGlobal: false,
                isException: false
            });
        }

        function triggerIdentify() {
            channel.postMessage({ type: 'SHOW_NUMBERS' });
        }


        // ==========================================
        // ПРИЕМНИК КОМАНД И ОБРАБОТКА (ДЛЯ КЛИЕНТОВ)
        // ==========================================
        let clientUrl1 = "about:blank";
        let clientUrl2 = "about:blank";
        let clientIsException = false;
        
        let stubActive = false;
        let activeStubUrl = "about:blank";

        channel.onmessage = (event) => {
            const msg = event.data;

            if (msg.type === 'REQUEST_ANNOUNCE') {
                announceScreen();
            }

            // Мастер регистрирует пришедший ответ и определяет уникальный ID
            if (msg.type === 'REGISTER_SCREEN' && isMaster) {
                const duplicates = window.discoveredScreens.filter(s => s.idx === msg.idx && s.resStr === msg.resStr);
                const nextSubIdx = duplicates.length + 1;
                
                if (nextSubIdx > 1) duplicates.forEach(d => d.isDuplicate = true);
                const idKey = `${msg.idx}_${nextSubIdx}_${msg.resStr.replace('x','_')}`;

                window.discoveredScreens.push({
                    idKey: idKey,
                    idx: msg.idx,
                    subIdx: nextSubIdx,
                    resStr: msg.resStr,
                    isDuplicate: nextSubIdx > 1
                });

                channel.postMessage({
                    type: 'ASSIGN_SUBID',
                    idx: msg.idx,
                    resStr: msg.resStr,
                    subIdx: nextSubIdx,
                    hasDuplicates: nextSubIdx > 1
                });
            }

            // Получение персонального подномера при совпадении параметров
            if (msg.type === 'ASSIGN_SUBID' && msg.idx === myIdx && msg.resStr === getResolutionStr()) {
                mySubIdx = msg.subIdx;
                document.getElementById('screen-number-display').innerText = msg.hasDuplicates ? `${myIdx},${mySubIdx}` : `${myIdx}`;
            }

            // Применение настроек URL для конкретного экрана
            if (msg.type === 'SET_SCREEN_URLS' && msg.idx === myIdx && msg.subIdx === mySubIdx) {
                clientUrl1 = msg.url1 || 'about:blank';
                clientUrl2 = msg.url2 || 'about:blank';
                clientIsException = msg.isException;
                renderFrameContent();
            }

            // Управление режимом заглушки
            if (msg.type === 'SET_STUB_MODE' && msg.idx === myIdx && msg.subIdx === mySubIdx) {
                // Если команда глобальная и стоит галочка "Исключить", игнорируем включение заглушки
                if (msg.isGlobal && msg.isException && msg.enable) {
                    stubActive = false;
                } else {
                    stubActive = msg.enable;
                }
                activeStubUrl = msg.stubUrl;
                renderFrameContent();
            }

            // Вывод номера плашки
            if (msg.type === 'SHOW_NUMBERS') {
                const display = document.getElementById('screen-number-display');
                display.style.display = 'block';
                setTimeout(() => { display.style.display = 'none'; }, 3000);
            }
        };

        // Логика обновления контента во фрейме
        function renderFrameContent() {
            const frame = document.getElementById('content-frame');
            
            if (stubActive) {
                if (frame.src !== activeStubUrl) frame.src = activeStubUrl;
            } else {
                // Если заглушка выключена, показываем Поток 1 (если пустой, то Поток 2)
                const targetUrl = clientUrl1 !== "about:blank" && clientUrl1 !== "" ? clientUrl1 : clientUrl2;
                if (frame.src !== targetUrl) frame.src = targetUrl;
            }
        }

        window.addEventListener('resize', () => {
            if (!isMaster) announceScreen();
        });

        window.addEventListener('beforeunload', () => {
            if (!isMaster) channel.postMessage({ type: 'REQUEST_ANNOUNCE' });
        });
    </script>
</body>
</html>
